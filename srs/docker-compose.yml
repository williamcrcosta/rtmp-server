services:
  srs:
    image: ossrs/srs:5
    container_name: srs-server
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8000:8000/udp"
      - "8080:8080"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ./index.html:/usr/local/srs/objs/nginx/html/cameras.html:ro
      - records:/var/records
    networks:
      - rtmp-net

  caddy:
    image: caddy:alpine
    container_name: rtmp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - srs
    networks:
      - rtmp-net

  # MediaMTX — pull RTSP das câmeras iM7 e serve WebRTC/HLS
  # Contorna a limitação do RTMP (que não carrega H.265 em modo High)
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    env_file:
      - ./mediamtx.env
    ports:
      - "8554:8554"      # RTSP out
      - "8888:8888"      # HLS
      - "8889:8889"      # WebRTC (player + WHEP/WHIP)
      - "8189:8189/udp"  # WebRTC UDP
      - "9997:9997"      # API
      - "9998:9998"      # métricas Prometheus
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - rtmp-net

networks:
  rtmp-net:
    driver: bridge

volumes:
  records:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECORDS_PATH:-/var/records}
  caddy_data:
  caddy_config:
