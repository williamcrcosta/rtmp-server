services:
  srs:
    image: ossrs/srs:5
    container_name: srs-server
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8000:8000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - ./index.html:/usr/local/srs/objs/nginx/html/cameras.html:ro
      - ./rtsp.html:/usr/local/srs/objs/nginx/html/rtsp.html:ro
      - records:/var/records
    networks:
      - rtmp-net

  caddy:
    image: caddy:alpine
    container_name: rtmp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - srs
    networks:
      - rtmp-net

  # MediaMTX — pull RTSP das câmeras iM7 e serve WebRTC/HLS
  # Contorna a limitação do RTMP (que não carrega H.265 em modo High)
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    env_file:
      - ./mediamtx.env
    ports:
      - "127.0.0.1:8554:8554"  # RTSP out (localhost — acesso so via caddy)
      - "127.0.0.1:8888:8888"      # HLS (localhost)
      - "127.0.0.1:8889:8889"      # WebRTC signaling (localhost)
      - "8189:8189/udp"  # WebRTC UDP
      - "127.0.0.1:9997:9997"      # API (localhost)
      - "127.0.0.1:9998:9998"      # métricas (localhost)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - rtmp-net

networks:
  rtmp-net:
    driver: bridge

volumes:
  records:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECORDS_PATH:-/var/records}
  caddy_data:
  caddy_config:
