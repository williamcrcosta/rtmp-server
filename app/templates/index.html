<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cameras</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Cameras</h1>
  <div class="user">{{ user.name }} · {{ user.role }} · <a href="/auth/logout">sair</a></div>
</header>
<main class="grid">
  {% for path, label in cameras.items() %}
  <div class="cam" data-path="{{ path }}">
    <div class="cam-head">
      <span class="label">{{ label }}</span>
      <span class="status" id="st-{{ path }}">...</span>
    </div>
    <video id="v-{{ path }}" autoplay muted playsinline></video>
  </div>
  {% endfor %}
</main>
<script src="/static/whep.js"></script>
<script>
const cams = {{ cameras | tojson }};

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    if (r.status === 401) location.reload();
    const st = await r.json();
    for (const [path, el] of Object.entries(cams)) {
      const s = document.getElementById('st-' + path);
      const info = st[path] || {};
      s.textContent = info.ready ? 'ao vivo' : 'offline';
      s.className = 'status ' + (info.ready ? 'on' : 'off');
    }
  } catch(e) {}
}
refreshStatus();
setInterval(refreshStatus, 15000);

for (const path of Object.keys(cams)) {
  startWHEP(document.getElementById('v-' + path), '/whep/' + path);
}
</script>
</body>
</html>
